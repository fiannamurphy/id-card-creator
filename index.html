
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Id Card Creator</title>
</head>
<body>
    <div id="root"></div>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@19",
            "react-dom/client": "https://esm.sh/react-dom@19/client",
            "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime"
        }
    }
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from "react";
        import ReactDOM from "react-dom/client";

        const logo = 'https://s7494.pcdn.co/wp-content/themes/algonquincollege2018/images/AC-Logo-White.png';

        const root = ReactDOM.createRoot(document.getElementById("root"));

        const Person = ({ person }) => {
            return (
                <div className="w-100 rounded-2xl overflow-hidden border border-black">
                    <div className="flex justify-between gap-4 p-4">
                        <div className="w-1/3">
                            <div className="border border-black w-full h-40 bg-[#F7F7F7] flex flex-col items-center">
                                <img src="https://www.kindpng.com/picc/m/24-248253_user-profile-default-image-png-clipart-png-download.png" alt="" />
                            </div>
                        </div>
                        <div className="w-2/3">
                            <h2 className="text-xl font-bold mb-3">{person.name}</h2>
                            <h3 className="text-sm font-bold">{person.type === 'student' ? 'STUDENT' : 'EMPLOYEE'} ID NO.</h3>
                            <p className="mb-3"><span>{person.idNumber}</span></p>
                            <p className="text-sm font-bold uppercase"><span>{person.type}</span></p>
                            <h3 className="text-xs font-bold">DATE ISSUED</h3>
                            <p><span>{person.issueDate}</span></p>
                        </div>
                    </div>
                    <div className="h-12 bg-green-900 relative">
                        <img className="relative w-32 top-3 left-2" src={logo} />
                    </div>
                </div>
            );
        }

        const IdMaker = ({ onCreateCard }) => {
            const [name, setName] = useState('');
            const [idNumber, setIdNumber] = useState('');
            const [type, setType] = useState('student');
            const [issueDate, setIssueDate] = useState('');

            const handleCreateCard = (e) => {
                e.preventDefault();

                const person = {
                    name: name,
                    idNumber: idNumber,
                    type: type,
                    issueDate: issueDate
                };

                onCreateCard(person);

                setName('');
                setIdNumber('');
                setType('student');
                setIssueDate('');
            }

            return (
                <div className="w-1/3 mx-auto">
                    <form className="flex flex-col gap-3" onSubmit={handleCreateCard}>
                        <input className="input w-full" type="text" required placeholder="Enter Person's name" value={name} onChange={(e) => setName(e.target.value)} />
                        <input className="input w-full" type="text" required placeholder="Enter Person's ID number" value={idNumber} onChange={(e) => setIdNumber(e.target.value)} />
                        <select className="select w-full" required value={type} onChange={(e) => {setType(e.target.value)}}>
                            <option value="student">Student</option>
                            <option value="faculty">Faculty</option>
                        </select>
                        <input className="input w-full" required type="date" placeholder="Enter issue date" value={issueDate} onChange={(e) => setIssueDate(e.target.value)} />
                        <button className="btn btn-primary btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl" type="submit">Create ID Card</button>
                    </form>
                </div>
            );
        }

        const App = () => {
            const [persons, setPersons] = useState(() => {
                return JSON.parse(localStorage.getItem('persons')) || [];
            });

            useEffect(() => {
                localStorage.setItem('persons', JSON.stringify(persons));
            }, [persons]);

            const createCard = (person) => {
                setPersons([...persons, person]);
            }

            return (
                <div className="container mx-auto p-8">
                    <IdMaker onCreateCard={createCard} />
                    <div className="flex flex-wrap gap-8 mt-8 justify-center">
                        {persons.map((person, index) => (
                            <Person key={index} person={person} />
                        ))}
                    </div>
                </div>
            );
        };

        root.render(<App />);
    </script>
</body>
</html>
